allowBuilds:
  "@firebase/util": true
  "@swc/core": true
  esbuild: true
  protobufjs: true
  re2: true

overrides:
  # Even Firebase 13 pins gRPC to the vulnerable ~1.9.0 range.
  "@firebase/firestore>@grpc/grpc-js": "^1.14.6"
  # get-uri still requires basic-ftp 5; the patched listing parser is in 6.2.1+.
  "get-uri>basic-ftp": "^6.2.3"
  # braces 3.0.4 is not published. Chokidar 4 removes it and supports the CLI's literal rule paths.
  "firebase-tools>chokidar": "^4.0.3"
  "@opentelemetry/core": "^2.8.0"
  "gaxios>uuid": "^11.1.1"
  "brace-expansion": ">=5.0.8"
  "qs": ">=6.16.0"
  "fast-uri": ">=3.1.6 <4"
  "js-yaml": ">=4.3.2 <5"
  "hono": ">=4.13.5 <5"
  "morgan": ">=1.12.0 <2"
  "prosemirror-view": "1.42.5"
